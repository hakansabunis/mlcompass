[project]
name = "mlcompass"
version = "0.7.2"
description = "An LLM agent that sits next to you through your whole ML pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Hakan Sabunis", email = "hakansabunis@gmail.com" },
]
keywords = [
    "machine-learning",
    "llm",
    "agent",
    "agentic",
    "claude-agent-sdk",
    "training",
    "monitoring",
    "claude",
    "pytorch",
    "tensorboard",
    "wandb",
    "mlops",
    "mcp",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "agentlite-py>=0.2.0",
    "watchdog>=4.0.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
tensorboard = ["tbparse>=0.0.7", "tensorboard>=2.10.0"]
wandb = ["wandb>=0.16.0"]
mcp = ["mcp>=1.2.0"]
agent = ["anthropic>=0.50.0"]
agent-claude-code = ["claude-agent-sdk>=0.2.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "tbparse>=0.0.7",
    "tensorboard>=2.10.0",
    "mcp>=1.2.0",
    "anthropic>=0.50.0",
    "claude-agent-sdk>=0.2.0",
]

[project.scripts]
mlcompass = "mlcompass.cli:main"
mlcompass-mcp = "mlcompass.mcp_server:main"

[project.urls]
Homepage = "https://github.com/hakansabunis/mlcompass"
Repository = "https://github.com/hakansabunis/mlcompass"
Issues = "https://github.com/hakansabunis/mlcompass/issues"
Changelog = "https://github.com/hakansabunis/mlcompass/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Long LLM system prompts live as triple-quoted strings in agents/*.py;
# breaking the prose mid-sentence hurts readability for prompt review.
"src/mlcompass/agents/*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

# Third-party packages without bundled type stubs. We don't add
# pandas-stubs / types-PyYAML to the dev set because they balloon the
# install and aren't needed for the runtime checks our tests care about.
[[tool.mypy.overrides]]
module = [
    "agentlite",
    "claude_agent_sdk",
    "claude_agent_sdk.*",
    "mcp",
    "mcp.*",
    "pandas",
    "tbparse",
    "yaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
