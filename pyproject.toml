[project]
name = "mlcompass"
version = "0.9.0"
description = "An LLM agent that sits next to you through your whole ML pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Hakan Sabunis", email = "hakansabunis@gmail.com" },
]
keywords = [
    "machine-learning",
    "llm",
    "agent",
    "agentic",
    "claude-agent-sdk",
    "training",
    "monitoring",
    "claude",
    "pytorch",
    "tensorboard",
    "wandb",
    "mlops",
    "mcp",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "agentlite-py>=0.2.0",
    "watchdog>=4.0.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
tensorboard = ["tbparse>=0.0.7", "tensorboard>=2.10.0"]
wandb = ["wandb>=0.16.0"]
# Ceiling is load-bearing, not caution. mcp 2.x removed
# ``mcp.server.fastmcp`` (FastMCP was renamed to MCPServer), which
# src/mlcompass/mcp_server.py:42 imports, so an unbounded ``mcp>=1.2.0``
# resolves to a version this code cannot import. Lift it only together
# with a migration of mcp_server.py to the v2 API.
mcp = ["mcp>=1.2.0,<2"]
# Both providers, because the contract claims provider independence and
# leakage_investigator.py imports ``openai`` on the provider="openai"
# path. Shipping only one of them makes an advertised capability
# uninstallable, which an artifact reviewer would hit immediately.
agent = ["anthropic>=0.50.0", "openai>=1.40.0"]
agent-claude-code = ["claude-agent-sdk>=0.2.0"]
# Baseline comparison arms for the measurement harness
# (scripts/baseline_guardrails.py; analysis_plan_2026-09 section 2). Pinned
# exactly on purpose: the arm's configuration depends on version-specific
# Guardrails behaviour (0.11.0 cannot reask on a whole-output validator), so
# an unpinned resolve would silently change what the baseline measures.
# Not needed to run or test mlcompass itself, only to run the baseline arms.
# Floor harmonised with the [agent] extra. Two different floors for one
# package in one file is how the mcp break happened: installing both
# extras silently resolves to whichever is higher, so the version the
# code was tested against is not the version that gets installed.
# `client.chat.completions.create` is stable across 1.x and 2.x, so the
# lower floor is the honest one; raise it only with a tested reason.
baselines = ["guardrails-ai==0.11.0", "openai>=1.40.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "tbparse>=0.0.7",
    "tensorboard>=2.10.0",
    "mcp>=1.2.0,<2",  # see the [mcp] extra above
    "anthropic>=0.50.0",
    "openai>=1.40.0",
    "claude-agent-sdk>=0.2.0",
]

[project.scripts]
mlcompass = "mlcompass.cli:main"
mlcompass-mcp = "mlcompass.mcp_server:main"

[project.urls]
Homepage = "https://github.com/hakansabunis/mlcompass"
Repository = "https://github.com/hakansabunis/mlcompass"
Issues = "https://github.com/hakansabunis/mlcompass/issues"
Changelog = "https://github.com/hakansabunis/mlcompass/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
# Ship the .md slash-command bodies so ``mlcompass install-slash-commands``
# can copy them into the user's ``.claude/commands/`` directory. Without
# this entry, ``pip install mlcompass`` would not put the .md files inside
# the wheel and the install command would fail with "no slash-command
# .md files were shipped".
mlcompass = ["slash_commands/*.md"]

[tool.ruff]
target-version = "py310"
line-length = 100

# Preserved benchmark evidence is never linted or formatted. `benchmark/runs/`
# holds the scripts models wrote, kept verbatim because `ab_protocol.md` §7
# makes the emitted script the artefact under study — it cannot be
# reconstructed from a score, and a formatter rewriting it destroys the record
# of what the model actually produced.
#
# This is not hypothetical. A `ruff format benchmark/` reformatted eight
# `emitted.py` files before this entry existed; they were restored from git,
# and the exclusion is here so the next person running the formatter cannot
# repeat it.
extend-exclude = ["benchmark/runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Long LLM system prompts live as triple-quoted strings in agents/*.py;
# breaking the prose mid-sentence hurts readability for prompt review.
"src/mlcompass/agents/*.py" = ["E501"]

[tool.mypy]
# 3.12, not the 3.10 runtime floor. numpy 2.5's stubs use PEP 695 `type`
# statements, which mypy refuses to parse under an older target — and it
# refuses by aborting the whole run ("errors prevented further checking"),
# so the gate produced no signal at all rather than a partial one. The
# runtime matrix already covers 3.10 through 3.13 on two operating
# systems; what this setting gives up is 3.10-specific *typing* checks,
# which the runtime cells catch in the cases that matter.
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

# Third-party packages without bundled type stubs. We don't add
# pandas-stubs / types-PyYAML to the dev set because they balloon the
# install and aren't needed for the runtime checks our tests care about.
[[tool.mypy.overrides]]
module = [
    "agentlite",
    "claude_agent_sdk",
    "claude_agent_sdk.*",
    "mcp",
    "mcp.*",
    "pandas",
    "tbparse",
    "yaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
